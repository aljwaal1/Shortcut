name: Publish direct-download Shortcut APK

on:
  push:
    branches:
      - feature/android-v1-phase1
    paths:
      - .github/workflows/publish-direct-apk.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Android CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 41329327694 --repo "${{ github.repository }}" --name shortcut-debug-apk --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Shortcut-latest-2026-11-01.apk

      - name: Publish direct-download prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "shortcut-2026-11-01-preview" dist/Shortcut-latest-2026-11-01.apk \
            --repo "${{ github.repository }}" \
            --title "Shortcut Android - November 1, 2026 preview" \
            --notes "Built from verified successful Android CI run 41329327694 (commit f3306112422f0b13654bbf5a8131732e876068f5). Document scanner, table-photo Excel, accounting calculators, improved cards and navigation. Debug-signed Android preview; on-device testing pending." \
            --target f3306112422f0b13654bbf5a8131732e876068f5 \
            --prerelease
