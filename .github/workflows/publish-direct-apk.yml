name: Publish direct-download Shortcut APK

on:
  push:
    branches:
      - feature/android-v1-phase1
    paths:
      - .github/workflows/publish-direct-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified successful CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 39788992071 --repo "${{ github.repository }}" --name shortcut-debug-apk --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Shortcut-1864-TDLib.apk

      - name: Publish APK as prerelease for direct browser downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "shortcut-1864-preview" dist/Shortcut-1864-TDLib.apk \
            --repo "${{ github.repository }}" \
            --title "Shortcut Android APK Build 1864 (preview)" \
            --notes "Verified Android CI build #1864. Debug-signed preview. Personal Telegram TDLib functionality requires on-device testing." \
            --target de7621b9bc0407052182daf2966d6338eba2cd86 \
            --prerelease
