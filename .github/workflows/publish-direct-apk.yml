name: Publish direct-download Shortcut APK

on:
  push:
    branches:
      - feature/android-v1-phase1
    paths:
      - .github/workflows/publish-direct-apk.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified successful CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 40074634260 --repo "${{ github.repository }}" --name shortcut-debug-apk --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Shortcut-2020-Speed.apk

      - name: Publish APK as prerelease for direct browser downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "shortcut-2020-preview" dist/Shortcut-2020-Speed.apk \
            --repo "${{ github.repository }}" \
            --title "Shortcut Android APK Build 2020 (speed improvements)" \
            --notes "Verified Android CI build #2020. Improved event-trigger automation dispatch and screenshot template startup. Debug-signed preview; measure real-world latency on device." \
            --target e408b5be9d54979264545e2e4184e6ce6ae6f662 \
            --prerelease
