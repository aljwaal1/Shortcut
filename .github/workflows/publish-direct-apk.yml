name: Publish direct-download Shortcut APK

on:
  push:
    branches:
      - feature/android-v1-phase1
    paths:
      - .github/workflows/publish-direct-apk.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download successful Android CI APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          gh run download 42242654379 --repo "${{ github.repository }}" --name shortcut-debug-apk --dir dist
          test -s dist/app-debug.apk
          unzip -t dist/app-debug.apk >/dev/null
          mv dist/app-debug.apk dist/Shortcut-accounting-2026-11-06.apk

      - name: Publish direct-download prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "shortcut-2026-11-06-accounting-preview" dist/Shortcut-accounting-2026-11-06.apk \
            --repo "${{ github.repository }}" \
            --title "Shortcut Android - November 6, 2026 accounting and media preview" \
            --notes "Built from verified Android CI run 42242654379 (commit 9fe2e8df57873fd7a4cdeaf6dfc13745de19a0bd). Expanded guided accounting calculators, GIF quality presets, PDF splitting improvements, template review screen and redesigned tool cards. Debug-signed APK for on-device preview; further real-device testing is needed." \
            --target 9fe2e8df57873fd7a4cdeaf6dfc13745de19a0bd \
            --prerelease
